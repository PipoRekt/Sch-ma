<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schémas Flash</title>
<style>
:root{--bg:#f4f3ef;--fg:#1c1b19;--card:#fff;--mut:#77746c;--ac:#5b5bd6;--ok:#1f9d55;--ko:#e8590c;--bd:#e6e3db;--mask:#34322e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131312;--fg:#f0eee8;--card:#201f1d;--mut:#9b988f;--bd:#34322e;--mask:#cfccc1;--ac:#7c7cf0}}
:root[data-theme="dark"]{--bg:#131312;--fg:#f0eee8;--card:#201f1d;--mut:#9b988f;--bd:#34322e;--mask:#cfccc1;--ac:#7c7cf0}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:24px;margin:4px 0 2px}h2{font-size:16px;margin:22px 0 10px}
button,.btn{font:inherit;border-radius:12px;padding:11px 14px;background:var(--card);color:var(--fg);border:1px solid var(--bd);cursor:pointer}
button:disabled{opacity:.35}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.ko{background:var(--ko);color:#fff;border-color:var(--ko)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.s{flex:0 0 auto;padding:11px 10px}.card .row{flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.top{display:flex;gap:12px;align-items:center;margin-bottom:10px}.top img{width:72px;height:72px;object-fit:cover;border-radius:10px}.top>div{flex:1;min-width:0}
.mut{color:var(--mut);font-size:13px}
select,input[type=text]{font:inherit;width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);margin-bottom:8px}
.stage{position:relative;line-height:0;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
.stage *{pointer-events:none}.stage img{width:100%;display:block}
.m{position:absolute;background:var(--mask);border-radius:3px;box-shadow:0 0 0 1px var(--bg);color:var(--bg);font:700 11px/1 system-ui;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cur{background:var(--ac);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ac)}
.sel{background:var(--ac);opacity:.85;box-shadow:0 0 0 2px #fff}
.rev{background:transparent;box-shadow:0 0 0 3px var(--ok)}
.hd{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ac);transform:translate(-50%,-50%)}
.bar,.tabs{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.bar .row,.tabs .row{max-width:640px;margin:auto}
.tabs button{border:0;background:none;color:var(--mut);font-size:14px}.tabs .on{color:var(--ac);font-weight:700}
.prog{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:4px}
.center{text-align:center;padding:36px 0}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp .card{margin:0;text-align:center}.kp b{font-size:26px;display:block}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px}.chart>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center}
.chart i{display:block;border-radius:3px 3px 0 0}.chart span{font-size:10px;color:var(--mut);line-height:1.6}
</style></head><body><div id="app"></div>
<script>
let S=[],L={},F=[];try{S=JSON.parse(localStorage.getItem('sf')||'[]');L=JSON.parse(localStorage.getItem('sfl')||'{}');F=JSON.parse(localStorage.getItem('sff')||'[]')}catch(e){}
S.forEach(s=>{if(s.f&&!F.includes(s.f))F.push(s.f)});
const save=()=>{try{localStorage.setItem('sf',JSON.stringify(S));localStorage.setItem('sfl',JSON.stringify(L));localStorage.setItem('sff',JSON.stringify(F))}catch(e){alert('Stockage plein : supprime un schéma.')}};
const $=id=>document.getElementById(id),app=$('app');
const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=d=>(d||new Date()).toLocaleDateString('sv');
const mast=s=>s.masks.filter(m=>m.last===1).length, weak=s=>s.masks.map((m,k)=>m.last===0?k:-1).filter(k=>k>=0);
const pc=(a,b)=>b?Math.round(a/b*100):0;
let D,st,sel=-1,tmp=null,hist=[],fo=null;

function tabs(on){return `<div class="tabs"><div class="row"><button class="${on=='h'?'on':''}" onclick="fo=null;home()">📚 Schémas</button><button class="${on=='s'?'on':''}" onclick="stats()">📊 Statistiques</button></div></div>`}
const fst=f=>{const ss=S.filter(s=>s.f===f);return{ns:ss.length,n:ss.reduce((a,s)=>a+s.masks.length,0),m:ss.reduce((a,s)=>a+mast(s),0),w:ss.reduce((a,s)=>a+weak(s).length,0)}};
function cardS(s,i){const p=pc(mast(s),s.masks.length),w=weak(s).length;return `<div class="card"><div class="top"><img src="${s.img}"><div><b>${esc(s.name)}</b><div class="mut">${s.masks.length} cartes${s.by?' · par '+esc(s.by):''}</div><div class="prog" style="margin:8px 0 4px"><i style="width:${p}%"></i></div><div class="mut">${p}% maîtrisé</div></div></div><div class="row"><button class="pri" onclick="go('s',${i})">Réviser</button>${w?`<button class="ko" onclick="go('s',${i},1)">Ratées (${w})</button>`:''}<button class="s" onclick="out([S[${i}]],S[${i}].name)">📤</button><button class="s" onclick="edit(${i})">✏️</button><button class="s" onclick="mv(${i})">📁</button><button class="s" onclick="delc(${i})">🗑</button></div></div>`}
function cardF(f,j){const t=fst(f),p=pc(t.m,t.n);return `<div class="card"><div class="top"><div><b>${esc(f)}</b><div class="mut">${t.ns} schéma(s) · ${t.n} cartes</div><div class="prog" style="margin:8px 0 4px"><i style="width:${p}%"></i></div><div class="mut">${p}% maîtrisé</div></div></div><div class="row"><button onclick="fo=${j};home()">Ouvrir</button>${t.n?`<button class="pri" onclick="go('f',${j})">Réviser</button>`:''}<button class="s" onclick="renF(${j})">✏️</button><button class="s" onclick="delF(${j})">🗑</button></div></div>`}
function home(){
  const fn=fo!==null?F[fo]:null,list=S.map((s,i)=>[s,i]).filter(([s])=>fn!==null?s.f===fn:!s.f);let h='';
  const add=`<label class="btn pri" style="display:block;text-align:center;margin-bottom:10px">📷 Nouveau schéma${fn!==null?' dans ce dossier':''}<input type="file" accept="image/*" hidden onchange="pick(this.files[0])"></label>`;
  if(fn!==null){const t=fst(fn);
    h=`<div class="row"><button class="s" onclick="fo=null;home()">←</button><h1 style="flex:3;margin:0">📁 ${esc(fn)}</h1></div><div class="mut" style="margin:6px 0 14px">${t.ns} schéma(s) · ${t.n} cartes · ${pc(t.m,t.n)}% maîtrisé</div>${add}`;
    if(t.n)h+=`<div class="row" style="margin-bottom:14px"><button class="pri" onclick="go('f',${fo})">▶ Réviser le dossier</button>${t.w?`<button class="ko" onclick="go('f',${fo},1)">Ratées (${t.w})</button>`:''}<button class="s" onclick="out(S.filter(s=>s.f===F[${fo}]),F[${fo}])">📤</button></div>`;
  }else{
    h=`<h1>🧠 Schémas Flash</h1><div class="mut" style="margin-bottom:14px">${S.length} schéma(s) · ${F.length} dossier(s)</div>${add}
    <div class="row" style="margin-bottom:10px"><button onclick="newF()">📁 Nouveau dossier</button><button onclick="go('a')">🎲 Tout réviser</button></div>
    <div class="row" style="margin-bottom:16px"><label class="btn" style="text-align:center">📥 Importer<input type="file" accept=".json,application/json" multiple hidden onchange="imp(this.files);this.value=''"></label><button onclick="S.length&&out(S,'mes-fiches')">📤 Tout partager</button></div>`;
    h+=F.map(cardF).join('');if(F.length&&list.length)h+='<h2>Sans dossier</h2>';
  }
  h+=list.map(([s,i])=>cardS(s,i)).join('');
  if(!list.length&&!F.length)h+='<p class="mut center">Prends un schéma en photo, masque les légendes, révise.</p>';
  if(!list.length&&fn!==null)h+='<p class="mut center">Dossier vide : ajoute un schéma ici, ou choisis ce dossier dans l\'écran ✏️ d\'un schéma existant.</p>';
  app.innerHTML=h+tabs('h');
}
function mv(i){
  const o=document.createElement('div');o.id='mvb';o.style.cssText='position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9';
  o.onclick=e=>{if(e.target===o)o.remove()};
  const cur=S[i].f,b=(c,l,a)=>`<button class="${c?'pri':''}" style="text-align:left" onclick="${a}">${l}</button>`;
  o.innerHTML=`<div style="background:var(--bg);width:100%;max-width:640px;box-sizing:border-box;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:75vh;overflow:auto"><b>Déplacer « ${esc(S[i].name)} » vers…</b><div style="display:grid;gap:8px;margin-top:12px">${b(!cur,'📂 Sans dossier',`mvto(${i},-1)`)}${F.map((f,j)=>b(f===cur,'📁 '+esc(f),`mvto(${i},${j})`)).join('')}${b(0,'＋ Nouveau dossier…',`mvnew(${i})`)}<button onclick="document.getElementById('mvb').remove()">Annuler</button></div></div>`;
  document.body.appendChild(o);
}
function mvto(i,j){if(j<0)delete S[i].f;else S[i].f=F[j];save();const o=document.getElementById('mvb');if(o)o.remove();home()}
function mvnew(i){const n=(prompt('Nom du dossier :')||'').trim();if(!n)return;if(!F.includes(n))F.push(n);mvto(i,F.indexOf(n))}
function newF(){const n=(prompt('Nom du dossier (ex. Cardio) :')||'').trim();if(n&&!F.includes(n)){F.push(n);save();home()}}
function renF(j){const n=(prompt('Nouveau nom :',F[j])||'').trim();if(n&&!F.includes(n)){S.forEach(s=>{if(s.f===F[j])s.f=n});F[j]=n;save();home()}}
function delF(j){if(confirm('Supprimer le dossier « '+F[j]+' » ? Les schémas ne sont pas supprimés, ils repassent « sans dossier ».')){S.forEach(s=>{if(s.f===F[j])delete s.f});F.splice(j,1);fo=null;save();home()}}
function stats(){
  const days=[...Array(14)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-13+k);const k2=day(d);return{k:k2,l:d.toLocaleDateString('fr',{weekday:'narrow'}),...(L[k2]||{ok:0,ko:0})}});
  const ok=Object.values(L).reduce((a,x)=>a+x.ok,0),ko=Object.values(L).reduce((a,x)=>a+x.ko,0);
  let streak=0,d=new Date();if(!L[day(d)])d.setDate(d.getDate()-1);while(L[day(d)]){streak++;d.setDate(d.getDate()-1)}
  const tm=S.reduce((a,s)=>a+s.masks.length,0),mm=S.reduce((a,s)=>a+mast(s),0),mx=Math.max(1,...days.map(x=>x.ok+x.ko));
  const E=S.map(s=>({n:s.name,m:mast(s),t:s.masks.length,w:weak(s).length,seen:s.masks.some(x=>x.last!==undefined),p:pc(mast(s),s.masks.length)})).sort((a,b)=>b.p-a.p||b.m-a.m);
  const FE=F.map(f=>{const t=fst(f);return{n:f,m:t.m,t:t.n,w:t.w,seen:S.some(s=>s.f===f&&s.masks.some(x=>x.last!==undefined)),p:pc(t.m,t.n)}}).filter(x=>x.t).sort((a,b)=>b.p-a.p||b.m-a.m);
  const rk=(arr,ic)=>arr.map((x,i)=>`<div class="card"><div class="row"><b style="flex:3">${x.seen&&i<3?['🥇','🥈','🥉'][i]+' ':''}${ic}${esc(x.n)}</b><span class="mut s">${x.p}%</span></div><div class="prog" style="margin:8px 0 4px"><i style="width:${x.p}%"></i></div><div class="mut">${x.m}/${x.t} maîtrisées${x.w?` · ${x.w} à retravailler`:''}</div></div>`).join('');
  const rv2=a=>a.filter(x=>x.seen),bs=rv2(E),bf=rv2(FE);
  const ins=[bf.length?`🏆 Dossier le mieux maîtrisé : <b>${esc(bf[0].n)}</b> (${bf[0].p}%)`:'',bs.length?`🏆 Schéma le mieux maîtrisé : <b>${esc(bs[0].n)}</b> (${bs[0].p}%)`:'',bs.length>1&&bs[bs.length-1].p<100?`⚠️ À renforcer : <b>${esc(bs[bs.length-1].n)}</b> (${bs[bs.length-1].p}%)`:'',bf.length>1&&bf[bf.length-1].p<100?`⚠️ Dossier à renforcer : <b>${esc(bf[bf.length-1].n)}</b> (${bf[bf.length-1].p}%)`:''].filter(Boolean);
  app.innerHTML=`<h1>📊 Statistiques</h1><div class="mut" style="margin-bottom:14px">Ta progression, jour après jour</div>
  <div class="kp"><div class="card"><b>${ok+ko}</b><span class="mut">réponses</span></div><div class="card"><b>${pc(ok,ok+ko)}%</b><span class="mut">de réussite</span></div>
  <div class="card"><b>🔥 ${streak}</b><span class="mut">jour(s) d'affilée</span></div><div class="card"><b>${pc(mm,tm)}%</b><span class="mut">cartes maîtrisées</span></div></div>
  ${ins.length?`<div class="card" style="margin-top:12px;line-height:1.9">${ins.join('<br>')}</div>`:''}
  <h2>14 derniers jours</h2><div class="card"><div class="chart">${days.map(x=>`<div><i style="height:${x.ko/mx*90}px;background:var(--ko)"></i><i style="height:${x.ok/mx*90}px;background:var(--ok)"></i><span>${x.l}</span></div>`).join('')}</div>
  <div class="mut" style="margin-top:6px"><span style="color:var(--ok)">■</span> sues &nbsp; <span style="color:var(--ko)">■</span> ratées</div></div>
  ${FE.length?'<h2>Classement des dossiers</h2>'+rk(FE,'📁 '):''}<h2>Classement des schémas</h2>${rk(E,'')||'<p class="mut">Aucun schéma pour l\'instant.</p>'}${tabs('s')}`;
}
function pick(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    D={i:null,f:fo!==null?F[fo]:'',name:'',img:c.toDataURL('image/jpeg',.72),masks:[]};editor()};im.src=r.result};r.readAsDataURL(f);
}
function edit(i){D={i,f:S[i].f||'',name:S[i].name,img:S[i].img,masks:JSON.parse(JSON.stringify(S[i].masks))};editor()}
function ml(){const h=sel>=0?(r=>[[r.x,r.y],[r.x+r.w,r.y],[r.x,r.y+r.h],[r.x+r.w,r.y+r.h]].map(c=>`<div class="hd" style="left:${c[0]}%;top:${c[1]}%"></div>`).join(''))(D.masks[sel]):'';
  const b=r=>`left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%`;
  return D.masks.map((r,i)=>`<div class="m${i==sel?' sel':''}" style="${b(r)}">${i+1}</div>`).join('')+(tmp?`<div class="m cur" style="${b(tmp)}"></div>`:'')+h}
function draw(){$('ml').innerHTML=ml();$('dz').disabled=sel<0;
  $('hint').innerHTML=sel>=0?`<b>Zone ${sel+1}</b> : glisse-la pour la déplacer, tire un coin pour la redimensionner.`:`${D.masks.length} zone(s). Glisse sur le schéma pour en tracer une, touche une zone pour la modifier.`}
function snap(){hist.push(JSON.stringify(D.masks))}
function undo(){if(hist.length){D.masks=JSON.parse(hist.pop());sel=-1;draw()}}
function dz(){if(sel>=0){snap();D.masks.splice(sel,1);sel=-1;draw()}}
function editor(){
  sel=-1;tmp=null;hist=[];
  app.innerHTML=`<h1>${D.i===null?'Nouveau schéma':'Modifier le schéma'}</h1><input type="text" id="nm" placeholder="Nom du schéma" value="${esc(D.name)}">
  <select id="fsl" onchange="fchg(this)">${fopts()}</select><p class="mut" id="hint" style="margin:0 0 8px"></p><div class="stage" id="stg"><img src="${D.img}"><span id="ml"></span></div>
  ${D.i!==null?'<p style="text-align:center"><button class="ko" style="padding:8px 12px;font-size:14px" onclick="del()">Supprimer le schéma</button></p>':''}
  <div class="bar"><div class="row"><button onclick="home()">✕</button><button onclick="undo()">↩︎ Annuler</button><button id="dz" onclick="dz()">🗑 Zone</button><button class="pri" onclick="fin()">Enregistrer</button></div></div>`;
  const g=$('stg');let mode=null,a=null,off=null;
  const pt=e=>{const b=g.getBoundingClientRect();return{x:Math.max(0,Math.min(100,(e.clientX-b.left)/b.width*100)),y:Math.max(0,Math.min(100,(e.clientY-b.top)/b.height*100))}};
  g.onpointerdown=e=>{g.setPointerCapture(e.pointerId);const p=pt(e),b=g.getBoundingClientRect(),rx=26/b.width*100,ry=26/b.height*100;mode=null;
    if(sel>=0){const r=D.masks[sel];for(const [cx,cy,ax,ay] of [[r.x,r.y,r.x+r.w,r.y+r.h],[r.x+r.w,r.y,r.x,r.y+r.h],[r.x,r.y+r.h,r.x+r.w,r.y],[r.x+r.w,r.y+r.h,r.x,r.y]])
      if(Math.abs(p.x-cx)<rx&&Math.abs(p.y-cy)<ry){snap();mode='rs';a={x:ax,y:ay};break}}
    if(!mode){let h=-1;D.masks.forEach((r,i)=>{if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h)h=i});
      if(h>=0){sel=h;snap();mode='mv';off={x:p.x-D.masks[h].x,y:p.y-D.masks[h].y}}else{sel=-1;mode='dr';a=p}}
    draw()};
  g.onpointermove=e=>{if(!mode)return;const p=pt(e);
    if(mode=='mv'){const r=D.masks[sel];r.x=Math.max(0,Math.min(100-r.w,p.x-off.x));r.y=Math.max(0,Math.min(100-r.h,p.y-off.y))}
    else{const r={x:Math.min(a.x,p.x),y:Math.min(a.y,p.y),w:Math.abs(p.x-a.x),h:Math.abs(p.y-a.y)};if(mode=='rs'){if(r.w>1&&r.h>1)Object.assign(D.masks[sel],r)}else tmp=r}
    draw()};
  g.onpointerup=()=>{if(mode=='dr'){if(tmp&&tmp.w>1.5&&tmp.h>1.2){snap();D.masks.push(tmp);sel=D.masks.length-1}tmp=null}mode=null;draw()};
  draw();
}
function fopts(){return '<option value="">📂 Sans dossier</option>'+F.map(f=>`<option${f===D.f?' selected':''}>${esc(f)}</option>`).join('')+'<option value="__new">＋ Nouveau dossier…</option>'}
function fchg(el){if(el.value==='__new'){const n=(prompt('Nom du dossier :')||'').trim();if(n){if(!F.includes(n))F.push(n);D.f=n}}else D.f=el.value;el.innerHTML=fopts()}
function fin(){
  if(!D.masks.length){alert('Ajoute au moins une zone à masquer.');return}
  const n=$('nm').value.trim()||'Schéma '+(S.length+1);
  const o={name:n,masks:D.masks};if(D.f)o.f=D.f;if(D.i===null)S.push({...o,img:D.img});else{Object.assign(S[D.i],o);if(!D.f)delete S[D.i].f}
  save();home();
}
function delc(i){if(confirm('Supprimer « '+S[i].name+' » et toutes ses cartes ?')){S.splice(i,1);save();home()}}
function del(){if(confirm('Supprimer ce schéma ?')){S.splice(D.i,1);save();home()}}

const BASE=[8,4,2,1.1,.6,.35];
const lvOf=m=>m.lv!==undefined?m.lv:(m.last===1?2:m.last===0?0:null);
const wt=m=>{const l=lvOf(m);if(l===null)return 6;const d=m.t?(Date.now()-m.t)/864e5:7;return BASE[l]*(1+Math.min(d,30)/10)};
function cards(t,v,w){const ss=t==='s'?[v]:t==='f'?S.map((s,i)=>s.f===F[v]?i:-1).filter(i=>i>=0):S.map((_,i)=>i),q=[];
  ss.forEach(i=>S[i].masks.forEach((m,k)=>{if(!w||m.last===0)q.push([i,k])}));return q}
function go(t,v,w){
  const n=cards(t,v,w).length;if(!n){alert('Aucune carte à réviser ici.');return}
  let last='10';try{last=localStorage.getItem('sfn')||'10'}catch(e){}
  const o=document.createElement('div');o.id='mvb';o.style.cssText='position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9';
  o.onclick=e=>{if(e.target===o)o.remove()};
  o.innerHTML=`<div style="background:var(--bg);width:100%;max-width:640px;box-sizing:border-box;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))"><b>Combien de questions ?</b>
  <div class="mut" style="margin:4px 0 12px">${n} carte(s) ${w?'ratée(s) ':''}disponible(s). Les cartes non sues reviennent plus souvent, sans que les sues disparaissent.</div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">${[5,10,15,20,0].map(x=>`<button class="${String(x)===last?'pri':''}" onclick="run('${t}',${v||0},${w||0},${x})">${x||'Tout'}</button>`).join('')}</div>
  <button style="width:100%;margin-top:10px" onclick="document.getElementById('mvb').remove()">Annuler</button></div>`;
  document.body.appendChild(o);
}
function run(t,v,w,n){
  const o=document.getElementById('mvb');if(o)o.remove();
  try{localStorage.setItem('sfn',n)}catch(e){}
  let q=cards(t,v,w).map(c=>({c,k:Math.pow(Math.random(),1/wt(S[c[0]].masks[c[1]]))})).sort((a,b)=>b.k-a.k);
  if(n&&q.length>n)q=q.slice(0,n);
  q=q.map(x=>x.c).sort(()=>Math.random()-.5);
  st={sp:[t,v,w],q,rev:false,all:true,total:q.length,ok:0,ko:0,f:new Set(),seen:new Set()};study();
}
function study(){
  const [si,c]=st.q[0]||[];
  if(c===undefined){
    app.innerHTML=`<div class="center"><h1>🎉 Terminé !</h1><p>${st.total} cartes validées.<br>Réussite au premier essai : <b>${pc(st.total-st.f.size,st.total)}%</b></p>
    <div class="row"><button onclick="go(...st.sp)">Recommencer</button><button class="pri" onclick="stats()">Voir mes stats</button></div></div>`;return}
  const s=S[si],b=s.masks.map((r,k)=>{const cu=k==c;if(!st.all&&!cu)return'';
    return`<div class="m${cu?(st.rev?' rev':' cur'):''}" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%"></div>`}).join('');
  app.innerHTML=`<div class="row"><button class="s" onclick="home()">←</button><b style="flex:3">${esc(s.name)}${s.f?` <span class="mut">· 📁 ${esc(s.f)}</span>`:''}</b><button class="s" onclick="st.all=!st.all;study()">${st.all?'Tout masqué':'Un seul'}</button></div>
  <div class="prog" style="margin:10px 0"><i style="width:${(st.total-st.q.length)/st.total*100}%"></i></div>
  <div class="mut" style="margin-bottom:8px">${st.total-st.q.length}/${st.total} validées · ✓ ${st.ok} · ✗ ${st.ko}</div>
  <div class="stage" onclick="rv()" style="touch-action:manipulation"><img src="${s.img}">${b}</div>
  <p class="mut center" style="padding:12px 0;font-size:15px">${st.rev?'Tu le savais ?':'Que cache la zone bleue ? Touche pour révéler.'}</p>
  <div class="bar"><div class="row">${st.rev?'<button class="ko" onclick="ans(0)">✗ Pas su</button><button class="ok" onclick="ans(1)">✓ Su</button>':'<button class="pri" onclick="rv()">Révéler</button>'}</div></div>`;
}
function rv(){if(!st.rev){st.rev=true;study()}}
function ans(ok){
  const [si,c]=st.q[0],m=S[si].masks[c],key=si+'-'+c,k=day();L[k]=L[k]||{ok:0,ko:0};
  if(!st.seen.has(key)){st.seen.add(key);m.lv=ok?Math.min(5,(lvOf(m)||0)+1):Math.max(0,(lvOf(m)||0)-2)}
  m.last=ok?1:0;m.t=Date.now();
  if(ok){L[k].ok++;st.ok++;st.q.shift()}else{L[k].ko++;st.ko++;st.f.add(key);st.q.push(st.q.shift())}
  save();st.rev=false;study();
}
async function out(list,name){
  let by='';try{by=localStorage.getItem('sfp')||''}catch(e){}
  if(!by){by=(prompt('Ton prénom (pour que tes amis sachent de qui vient la fiche) :')||'').trim();try{localStorage.setItem('sfp',by)}catch(e){}}
  const d={app:'schemas-flash',v:1,fiches:list.map(s=>({name:s.name,img:s.img,masks:s.masks.map(({x,y,w,h})=>({x,y,w,h})),by:s.by||by,f:s.f}))};
  const f=new File([JSON.stringify(d)],(name.replace(/[^\w\-]+/g,'_').slice(0,40)||'fiche')+'.sflash.json',{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function imp(files){
  let n=0,dup=0;
  for(const f of files){try{const d=JSON.parse(await f.text());if(d.app!=='schemas-flash')continue;
    for(const x of d.fiches){if(!x.img||!x.masks)continue;
      if(S.some(s=>s.name===x.name&&s.img.length===x.img.length)){dup++;continue}
      if(x.f&&!F.includes(x.f))F.push(x.f);S.push({name:x.name,img:x.img,masks:x.masks.map(({x,y,w,h})=>({x,y,w,h})),by:x.by,f:x.f});n++}}catch(e){}}
  save();home();alert(n+' fiche(s) ajoutée(s)'+(dup?' · '+dup+' déjà présente(s)':''));
}
home();
</script></body></html>
